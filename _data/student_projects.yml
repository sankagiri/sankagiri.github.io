  resources: "₹10–25k starter kit; optional better camera later."
- title: "A solar panel as a miniature power station"
  slug: solar-panel
  theme: heat-air
  description: "Move a shadow across a small panel and measure what happens to its power. Learn to predict and explain the loss."
  fit: "Energy, electronics, and outdoor experiments."
  resources: "₹8–20k; a secure sunny spot."
- title: "Map the air on your everyday walk"
  slug: air-quality
  theme: heat-air
  description: "Build a particle logger and repeat a route. Separate a persistent hotspot from weather, timing, and sensor error."
  fit: "Environmental measurement, maps, and careful comparisons."
  resources: "₹8–20k; paired loggers are a useful upgrade."
- title: "How quickly does your room exchange its air?"
  slug: room-ventilation
  theme: heat-air
  description: "Use CO₂ decay after ordinary occupancy to compare window and door arrangements. Fit a model of the room."
